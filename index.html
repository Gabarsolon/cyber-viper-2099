<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER VIPER 2099 // Ultra Neon Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050713;
      --card-bg: rgba(12, 16, 36, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #00f2fe;
      --accent-magenta: #ff007f;
      --accent-gold: #ffd200;
      --accent-green: #00ff87;
      --accent-purple: #7928ca;
      --font-display: 'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: var(--bg-color);
      color: #fff;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 10px;
      position: relative;
    }

    /* Ambient animated neon backdrop */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.14), transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.16), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(121, 40, 202, 0.12), transparent 60%);
      filter: blur(50px);
      animation: ambientShift 16s ease-in-out infinite alternate;
    }

    @keyframes ambientShift {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.12) rotate(3deg); }
      100% { transform: scale(1) rotate(-2deg); }
    }

    /* Main Container */
    .game-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 780px;
      gap: 10px;
    }

    /* Header & Glassmorphic HUD */
    .hud-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 18px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent-cyan), #ffffff, var(--accent-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
    }

    .brand-badge {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      letter-spacing: 1.5px;
      font-weight: 800;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 14px;
      border-radius: 12px;
      min-width: 82px;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #8c9cb8;
    }

    .stat-val {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
      transition: transform 0.15s ease;
    }

    .stat-val.bounce {
      transform: scale(1.28);
      color: var(--accent-cyan);
      text-shadow: 0 0 20px var(--accent-cyan);
    }

    /* Combo Pill */
    .combo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.25), rgba(255, 210, 0, 0.25));
      border: 1px solid var(--accent-magenta);
      color: #ffb8ea;
      box-shadow: 0 0 18px rgba(255, 0, 127, 0.4);
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .combo-badge.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Sub-bar: Boost Meter & Controls */
    .hud-subbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(12, 16, 36, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      flex-wrap: wrap;
    }

    .boost-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 180px;
    }

    .boost-label {
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .boost-track {
      flex: 1;
      height: 9px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0, 242, 254, 0.3);
    }

    .boost-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00f2fe, #ff007f);
      border-radius: 10px;
      box-shadow: 0 0 12px #00f2fe;
      transition: width 0.08s linear;
    }

    .boost-container.active .boost-fill {
      box-shadow: 0 0 20px #ff007f;
      background: linear-gradient(90deg, #ff007f, #ffd200);
    }

    .action-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cfd8ea;
      padding: 5px 9px;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-cyan);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-icon.active {
      background: rgba(0, 242, 254, 0.18);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.45);
    }

    /* Main Viewport / Canvas Container */
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 68vh;
      border-radius: 20px;
      padding: 3px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.6), rgba(255, 0, 127, 0.6), rgba(121, 40, 202, 0.6));
      box-shadow: 
        0 15px 45px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(0, 242, 254, 0.3);
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    .canvas-container.boosting {
      box-shadow: 
        0 15px 50px rgba(0, 0, 0, 0.9),
        0 0 70px rgba(255, 0, 127, 0.6);
    }

    .canvas-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 17px;
      overflow: hidden;
      background: #060814;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* CRT Scanline & Curved Vignette Overlay */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: 
        radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.65) 100%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0.16) 1px, transparent 1px, transparent 2px);
      border-radius: 17px;
      opacity: 0.65;
      transition: opacity 0.3s ease;
    }

    .crt-overlay.disabled {
      opacity: 0;
    }

    /* Overlays: Pause & Game Over */
    .game-modal {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 19, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 17px;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-modal.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .modal-card {
      background: rgba(16, 21, 48, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 242, 254, 0.25);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 390px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff, var(--accent-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
    }

    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 2px 0;
    }

    .modal-stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 6px;
    }

    .modal-stat-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #8c9cb8;
      text-transform: uppercase;
    }

    .modal-stat-val {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    .new-high-badge {
      display: none;
      align-self: center;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 10px;
      background: linear-gradient(90deg, #ffd200, #ff007f);
      color: #000;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 210, 0, 0.7);
      animation: pulseRecord 1s infinite alternate;
    }

    @keyframes pulseRecord {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .btn-primary {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 14px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #050713;
      background: linear-gradient(135deg, var(--accent-cyan), #00ff87);
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 28px rgba(0, 242, 254, 0.7);
    }

    .btn-primary:active {
      transform: translateY(1px) scale(0.99);
    }

    /* Theme Picker bar */
    .theme-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .theme-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      position: relative;
    }

    .theme-dot.active {
      border-color: #fff;
      transform: scale(1.22);
      box-shadow: 0 0 15px currentColor;
    }

    /* On-Screen Mobile Controls */
    .mobile-controls {
      display: none;
      width: 100%;
      max-width: 440px;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      margin-top: 2px;
    }

    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 6px;
    }

    .dpad-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: all 0.1s;
    }

    .dpad-btn:active {
      background: var(--accent-cyan);
      color: #000;
      transform: scale(0.92);
      box-shadow: 0 0 16px var(--accent-cyan);
    }

    .mobile-boost-btn {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.25), rgba(255, 210, 0, 0.25));
      border: 2px solid var(--accent-magenta);
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
      transition: all 0.1s;
    }

    .mobile-boost-btn:active {
      background: var(--accent-magenta);
      color: #000;
      transform: scale(0.92);
      box-shadow: 0 0 32px var(--accent-magenta);
    }

    /* Key hints footer */
    .keyboard-hints {
      font-size: 0.75rem;
      color: #6a7c9d;
      letter-spacing: 0.8px;
      text-align: center;
      margin-top: 2px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .keyboard-hints kbd {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cfd8ea;
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .mobile-controls {
        display: flex;
      }
      .keyboard-hints {
        display: none;
      }
      .hud-bar {
        padding: 8px 12px;
      }
      .brand-title {
        font-size: 1rem;
      }
      .stat-val {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Background -->
  <div class="ambient-bg"></div>

  <div class="game-wrapper">

    <!-- Top HUD Bar -->
    <header class="hud-bar">
      <div class="brand-title">
        <span>Cyber Viper</span>
        <span class="brand-badge">2099</span>
      </div>

      <div class="stats-group">
        <div class="combo-badge" id="comboBadge">
          <span>⚡</span>
          <span id="comboText">COMBO x2</span>
        </div>

        <div class="stat-pill">
          <span class="stat-label">Score</span>
          <span class="stat-val" id="scoreVal">0</span>
        </div>

        <div class="stat-pill">
          <span class="stat-label">High</span>
          <span class="stat-val" id="highScoreVal">0</span>
        </div>
      </div>
    </header>

    <!-- Sub-bar: Overdrive Boost & Controls -->
    <div class="hud-subbar">
      <div class="boost-container" id="boostContainer">
        <span class="boost-label">
          <span>⚡ OVERDRIVE</span>
        </span>
        <div class="boost-track">
          <div class="boost-fill" id="boostFill"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn-icon active" id="btnAudio" title="Toggle Sound FX">
          <span id="audioIcon">🔊</span>
          <span>SFX</span>
        </button>
        <button class="btn-icon" id="btnMusic" title="Toggle Synthwave Background Music">
          <span>🎵</span>
          <span>SYNTH</span>
        </button>
        <button class="btn-icon" id="btnWalls" title="Toggle Wall Boundary Mode">
          <span>🛡️</span>
          <span id="wallsLabel">SOLID</span>
        </button>
        <button class="btn-icon active" id="btnCrt" title="Toggle Retro CRT Scanline Shader">
          <span>📺</span>
          <span>CRT</span>
        </button>
        <button class="btn-icon" id="btnSpeed" title="Cycle Game Pace">
          <span>⚡</span>
          <span id="speedLabel">NORMAL</span>
        </button>
      </div>
    </div>

    <!-- Canvas Play Area -->
    <div class="canvas-container" id="canvasContainer">
      <div class="canvas-inner">
        <canvas id="gameCanvas"></canvas>
        <div class="crt-overlay" id="crtOverlay"></div>

        <!-- Start / Pause / Game Over Modal -->
        <div class="game-modal" id="gameModal">
          <div class="modal-card">
            <div class="new-high-badge" id="newHighBadge">🏆 NEW RECORD!</div>
            <h2 class="modal-title" id="modalTitle">READY?</h2>

            <div class="modal-stats" id="modalStatsGrid">
              <div class="modal-stat-box">
                <div class="modal-stat-label">FINAL SCORE</div>
                <div class="modal-stat-val" id="modalScoreVal">0</div>
              </div>
              <div class="modal-stat-box">
                <div class="modal-stat-label">MAX COMBO</div>
                <div class="modal-stat-val" id="modalComboVal">x1</div>
              </div>
              <div class="modal-stat-box">
                <div class="modal-stat-label">ORBS EATEN</div>
                <div class="modal-stat-val" id="modalOrbsVal">0</div>
              </div>
              <div class="modal-stat-box">
                <div class="modal-stat-label">TIME ALIVE</div>
                <div class="modal-stat-val" id="modalTimeVal">0s</div>
              </div>
            </div>

            <!-- Skin Color Themes -->
            <div style="font-family: var(--font-display); font-size: 0.65rem; color: #8c9cb8; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;">
              SELECT THEME PALETTE
            </div>
            <div class="theme-picker" id="themePicker">
              <!-- Rendered dynamically -->
            </div>

            <button class="btn-primary" id="btnActionModal">
              LAUNCH VIPER
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- On-Screen Virtual Controls for Touch / Mobile -->
    <div class="mobile-controls">
      <div class="dpad-grid">
        <div></div>
        <button class="dpad-btn" id="dpadUp">▲</button>
        <div></div>
        <button class="dpad-btn" id="dpadLeft">◀</button>
        <div></div>
        <button class="dpad-btn" id="dpadRight">▶</button>
        <div></div>
        <button class="dpad-btn" id="dpadDown">▼</button>
        <div></div>
      </div>

      <button class="mobile-boost-btn" id="mobileBoostBtn">
        <span style="font-size: 1.3rem;">🔥</span>
        <span>BOOST</span>
      </button>
    </div>

    <!-- Keyboard shortcuts hints -->
    <footer class="keyboard-hints">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>▲</kbd><kbd>▼</kbd><kbd>◀</kbd><kbd>▶</kbd> Steer</span>
      <span><kbd>SPACE</kbd> or <kbd>SHIFT</kbd> Turbo Overdrive</span>
      <span><kbd>P</kbd> Pause</span>
      <span><kbd>M</kbd> Mute Audio</span>
    </footer>

  </div>

  <script>
    /* =====================================================================
       CYBER VIPER 2099 - ULTRA NEON ENGINE
       ===================================================================== */

    // --- Color Themes & Palettes ---
    const THEMES = [
      {
        id: 'cyber',
        name: 'Cyber Neon',
        head: '#00f2fe',
        bodyGrad: ['#00f2fe', '#8a2be2', '#ff007f'],
        eye: '#ffffff',
        eyePupil: '#020b1e',
        glow: '#00f2fe',
        food: '#ff007f',
        foodGlow: '#ff007f',
        superFood: '#ffd200',
        gridLine: 'rgba(0, 242, 254, 0.08)',
        dotColor: '#00f2fe'
      },
      {
        id: 'synthwave',
        name: 'Synthwave Sunset',
        head: '#ff007f',
        bodyGrad: ['#ff007f', '#7928ca', '#ffd200'],
        eye: '#ffffff',
        eyePupil: '#16021f',
        glow: '#ff007f',
        food: '#ffd200',
        foodGlow: '#ffd200',
        superFood: '#00f2fe',
        gridLine: 'rgba(255, 0, 127, 0.08)',
        dotColor: '#ff007f'
      },
      {

    // --- Web Audio Synthesizer (Procedural SFX & Ambient Beats) ---
    class SynthEngine {
      constructor() {
        this.ctx = null;
        this.sfxEnabled = true;
        this.musicEnabled = false;
        this.musicInterval = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playEat(comboCount) {
        if (!this.sfxEnabled || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;

        // Pentatonic scale frequency calculation based on combo
        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        const noteIdx = Math.min(comboCount, scale.length - 1);
        const freq = scale[noteIdx];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.12);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.15);
      }

      playSuperEat() {
        if (!this.sfxEnabled || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major Arpeggio Fanfare

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const startTime = now + idx * 0.045;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.22);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.24);
        });
      }

      playTurn() {
        if (!this.sfxEnabled || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.035);

        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.038);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.04);
      }

      playGameOver() {
        if (!this.sfxEnabled || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.42);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.46);
      }

      toggleMusic() {
        this.musicEnabled = !this.musicEnabled;
        if (this.musicEnabled) {
          this.startMusic();
        } else {
          this.stopMusic();
        }
        return this.musicEnabled;
      }

      startMusic() {
        this.init();
        if (this.musicInterval) clearInterval(this.musicInterval);
        
        // Ambient cyberpunk chord progression (Am, F, C, G)
        const chords = [
          [220, 261.63, 329.63], // Am
          [174.61, 220, 261.63], // F
          [261.63, 329.63, 392], // C
          [196, 246.94, 293.66]  // G
        ];

        let chordIndex = 0;
        const playPad = () => {
          if (!this.musicEnabled || !this.ctx) return;
          const chord = chords[chordIndex];
          chordIndex = (chordIndex + 1) % chords.length;
          const now = this.ctx.currentTime;

          chord.forEach(freq => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.035, now + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 3.0);
          });
        };

        playPad();
        this.musicInterval = setInterval(playPad, 3000);
      }

      stopMusic() {
        if (this.musicInterval) {
          clearInterval(this.musicInterval);
          this.musicInterval = null;
        }
      }
    }

    const sound = new SynthEngine();

    // --- Particle System ---
    class Particle {
      constructor(x, y, color, speed, size, life, shape = 'circle') {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const velocity = (Math.random() * 0.8 + 0.2) * speed;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity;
        this.size = size;
        this.initialSize = size;
        this.life = life;
        this.maxLife = life;
        this.shape = shape;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.94;
        this.vy *= 0.94;
        this.life--;
        this.rotation += this.vRot;
        this.size = Math.max(0, this.initialSize * (this.life / this.maxLife));
      }

      draw(ctx) {
        if (this.size <= 0.1 || this.life <= 0) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.shape === 'star') {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size, -Math.sin((18 + i * 72) * Math.PI / 180) * this.size);
            ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (this.size / 2));
          }
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // --- Floating Text Indicator ---
    class FloatText {
      constructor(x, y, text, color, scale = 1) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.scale = scale;
        this.life = 45;
        this.maxLife = 45;
      }

      update() {
        this.y -= 1.2;
        this.life--;
      }

      draw(ctx) {
        if (this.life <= 0) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = `800 ${Math.round(15 * this.scale)}px 'Orbitron', sans-serif`;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    // --- Shockwave Pulse Ring ---
    class Shockwave {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = 4;
        this.maxRadius = 65;
        this.life = 25;
        this.maxLife = 25;
      }

      update() {
        this.radius += (this.maxRadius - this.radius) * 0.16;
        this.life--;
      }

      draw(ctx) {
        if (this.life <= 0) return;
        const alpha = Math.max(0, this.life / this.maxLife) * 0.75;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 14;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- Main Game Engine ---
    class SnakeGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        // Grid Dimensions

        this.highScore = parseInt(localStorage.getItem('cyber_viper_high') || '0', 10);

        // FX Collections

      init() {
        this.handleResize();
        window.addEventListener('resize', () => this.handleResize());
        this.ui.highScoreVal.textContent = this.highScore;

        this.initStars();
        this.initThemePicker();
        this.bindEvents();
        this.resetGame();

        // Start 60/120fps render loop
        requestAnimationFrame((time) => this.gameLoop(time));
      }

      initStars() {
        this.ambientStars = [];
        for (let i = 0; i < 45; i++) {
          this.ambientStars.push({
            x: Math.random(),
            y: Math.random(),
            size: Math.random() * 1.8 + 0.6,
            alpha: Math.random() * 0.5 + 0.2,
            speed: Math.random() * 0.0003 + 0.0001
          });
        }
      }

      initThemePicker() {
        const picker = this.ui.themePicker;
        picker.innerHTML = '';
        THEMES.forEach((theme) => {
          const dot = document.createElement('div');
          dot.className = `theme-dot ${theme.id === currentTheme.id ? 'active' : ''}`;
          dot.style.background = `linear-gradient(135deg, ${theme.head}, ${theme.food})`;
          dot.title = theme.name;
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            this.setTheme(theme);
          });
          picker.appendChild(dot);
        });
      }

      setTheme(theme) {
        currentTheme = theme;
        document.querySelectorAll('.theme-dot').forEach((d, idx) => {
          d.classList.toggle('active', THEMES[idx].id === theme.id);
        });
      }

      handleResize() {
        const rect = this.container.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const size = Math.floor(Math.min(rect.width, rect.height));

        this.canvas.width = size * dpr;
        this.canvas.height = size * dpr;
        this.ctx.setTransform(1, 0, 0, 1, 0, 0); // reset transform
        this.ctx.scale(dpr, dpr);
        this.canvasDisplaySize = size;
        this.cellSize = size / this.gridSize;
      }

      resetGame() {
        const mid = Math.floor(this.gridSize / 2);
        this.snake = [
          { x: mid, y: mid },
          { x: mid - 1, y: mid },
          { x: mid - 2, y: mid }
        ];
        this.prevSnake = JSON.parse(JSON.stringify(this.snake));
        this.dir = { x: 1, y: 0 };
        this.inputQueue = [];
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.orbsEaten = 0;
        this.boostEnergy = 100;
        this.superFood = null;
        this.superFoodSpawnCounter = 0;
        this.particles = [];
        this.floatingTexts = [];
        this.shockwaves = [];
        this.screenShake = 0;

        this.spawnFood();
        this.updateHUD();
      }

      startGame() {
        sound.init();
        this.resetGame();
        this.state = 'PLAYING';
        this.startTime = performance.now();
        this.lastTickTime = performance.now();
        this.ui.gameModal.classList.remove('visible');
      }

      pauseGame() {
        if (this.state === 'PLAYING') {
          this.state = 'PAUSED';
          this.ui.modalTitle.textContent = 'PAUSED';
          this.ui.newHighBadge.style.display = 'none';
          this.ui.btnActionModal.textContent = 'RESUME';
          this.populateModalStats();
          this.ui.gameModal.classList.add('visible');
        } else if (this.state === 'PAUSED') {
          this.state = 'PLAYING';
          this.lastTickTime = performance.now();
          this.ui.gameModal.classList.remove('visible');
        }
      }

      gameOver() {
        this.state = 'GAMEOVER';
        this.screenShake = 18;
        sound.playGameOver();

        const isNewHigh = this.score > this.highScore;
        if (isNewHigh) {
          this.highScore = this.score;
          localStorage.setItem('cyber_viper_high', this.highScore);
          this.ui.highScoreVal.textContent = this.highScore;
        }

        // Death burst particles
        this.snake.forEach(seg => {
          for (let i = 0; i < 4; i++) {
            const px = (seg.x + 0.5) * this.cellSize;
            const py = (seg.y + 0.5) * this.cellSize;
            this.particles.push(new Particle(px, py, currentTheme.head, 5, 5, 42));
          }
        });

        setTimeout(() => {
          this.ui.modalTitle.textContent = 'SYSTEM OVERLOAD';
          this.ui.newHighBadge.style.display = isNewHigh && this.score > 0 ? 'inline-block' : 'none';
          this.ui.btnActionModal.textContent = 'REBOOT VIPER';
          this.populateModalStats();
          this.ui.gameModal.classList.add('visible');
        }, 600);
      }

      populateModalStats() {
        this.ui.modalScoreVal.textContent = this.score;
        this.ui.modalComboVal.textContent = `x${Math.max(1, this.maxCombo)}`;
        this.ui.modalOrbsVal.textContent = this.orbsEaten;
        const elapsedSec = Math.floor((performance.now() - (this.startTime || performance.now())) / 1000);
        this.ui.modalTimeVal.textContent = `${elapsedSec}s`;
      }

      spawnFood() {
        let emptyCells = [];
        for (let x = 0; x < this.gridSize; x++) {
          for (let y = 0; y < this.gridSize; y++) {
            const occupied = this.snake.some(seg => seg.x === x && seg.y === y);
            const isSuper = this.superFood && this.superFood.x === x && this.superFood.y === y;
            if (!occupied && !isSuper) {
              emptyCells.push({ x, y });
            }
          }
        }

        if (emptyCells.length === 0) return;
        const pick = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        this.food = pick;
      }

      spawnSuperFood() {
        let emptyCells = [];
        for (let x = 0; x < this.gridSize; x++) {
          for (let y = 0; y < this.gridSize; y++) {
            const occupied = this.snake.some(seg => seg.x === x && seg.y === y);
            const isNormalFood = this.food.x === x && this.food.y === y;
            if (!occupied && !isNormalFood) {
              emptyCells.push({ x, y });
            }
          }
        }
        if (emptyCells.length === 0) return;
        const pick = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        this.superFood = {
          x: pick.x,
          y: pick.y,
          timer: 160,
          maxTimer: 160
        };

        const px = (pick.x + 0.5) * this.cellSize;
        const py = (pick.y + 0.5) * this.cellSize;
        this.shockwaves.push(new Shockwave(px, py, currentTheme.superFood));
      }

      queueDirection(dx, dy) {
        const last = this.inputQueue.length > 0 ? this.inputQueue[this.inputQueue.length - 1] : this.dir;
        // Prevent direct 180 reversal
        if (dx === -last.x && dy === -last.y) return;
        // Prevent redundant identical input
        if (dx === last.x && dy === last.y) return;
        if (this.inputQueue.length < 3) {
          this.inputQueue.push({ x: dx, y: dy });
        }
      }

      // --- Logical Step / Game Tick ---
      tick() {
        if (this.state !== 'PLAYING') return;

        // Process queued movement
        if (this.inputQueue.length > 0) {
          this.dir = this.inputQueue.shift();
          sound.playTurn();
        }

        this.prevSnake = JSON.parse(JSON.stringify(this.snake));

        const head = this.snake[0];
        let nx = head.x + this.dir.x;
        let ny = head.y + this.dir.y;

        // Wall Collision / Wrap Logic
        if (this.wallMode === 'PORTAL') {
          if (nx < 0) nx = this.gridSize - 1;
          if (nx >= this.gridSize) nx = 0;
          if (ny < 0) ny = this.gridSize - 1;
          if (ny >= this.gridSize) ny = 0;
        } else {
          // SOLID Boundary
          if (nx < 0 || nx >= this.gridSize || ny < 0 || ny >= this.gridSize) {
            this.gameOver();
            return;
          }
        }

        const newHead = { x: nx, y: ny };

        // Self-collision test
        for (let i = 0; i < this.snake.length; i++) {
          if (this.snake[i].x === newHead.x && this.snake[i].y === newHead.y) {
            this.gameOver();
            return;
          }
        }

        // Advance snake
        this.snake.unshift(newHead);

        // Check Food Eaten
        let ateFood = false;
        if (newHead.x === this.food.x && newHead.y === this.food.y) {
          this.handleEatFood();
          ateFood = true;
        }

        // Check Super Food Eaten
        if (this.superFood && newHead.x === this.superFood.x && newHead.y === this.superFood.y) {
          this.handleEatSuperFood();
          ateFood = true;
        }

        if (!ateFood) {
          this.snake.pop();
        }

        // Overdrive particle exhaust from tail
        if (this.isBoosting && this.snake.length > 1) {
          const tail = this.snake[this.snake.length - 1];
          const tx = (tail.x + 0.5) * this.cellSize;
          const ty = (tail.y + 0.5) * this.cellSize;
          this.particles.push(new Particle(tx, ty, currentTheme.food, 3.5, 4.5, 26));
        }
      }

      handleEatFood() {
        this.orbsEaten++;
        this.superFoodSpawnCounter++;
        this.combo++;
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;

        if (this.comboTimer) clearTimeout(this.comboTimer);
        this.comboTimer = setTimeout(() => {
          this.combo = 0;
          this.updateHUD();
        }, 3200);

        const boostMult = this.isBoosting ? 2 : 1;
        const points = 100 * Math.max(1, this.combo) * boostMult;
        this.score += points;

        // Restore some boost energy
        this.boostEnergy = Math.min(100, this.boostEnergy + 20);

        sound.playEat(this.combo);
        this.screenShake = 5;

        const fxX = (this.food.x + 0.5) * this.cellSize;
        const fxY = (this.food.y + 0.5) * this.cellSize;

        this.shockwaves.push(new Shockwave(fxX, fxY, currentTheme.foodGlow));
        for (let i = 0; i < 26; i++) {
          this.particles.push(new Particle(fxX, fxY, currentTheme.foodGlow, 5, 4.5, 32));
        }

        const comboStr = this.combo > 1 ? ` (x${this.combo})` : '';
        this.floatingTexts.push(new FloatText(fxX, fxY - 10, `+${points}${comboStr}`, currentTheme.foodGlow, 1 + this.combo * 0.08));

        this.ui.scoreVal.classList.add('bounce');
        setTimeout(() => this.ui.scoreVal.classList.remove('bounce'), 160);

        if (this.superFoodSpawnCounter >= 5 && !this.superFood) {
          this.superFoodSpawnCounter = 0;
          this.spawnSuperFood();
        }

        this.spawnFood();
        this.updateHUD();
      }

      handleEatSuperFood() {
        const bonusPoints = 500 * (this.isBoosting ? 2 : 1);
        this.score += bonusPoints;
        this.boostEnergy = 100;

        sound.playSuperEat();
        this.screenShake = 11;

        const fxX = (this.superFood.x + 0.5) * this.cellSize;
        const fxY = (this.superFood.y + 0.5) * this.cellSize;

        this.shockwaves.push(new Shockwave(fxX, fxY, currentTheme.superFood));
        for (let i = 0; i < 38; i++) {
          this.particles.push(new Particle(fxX, fxY, currentTheme.superFood, 6.5, 6, 36, 'star'));
        }

        this.floatingTexts.push(new FloatText(fxX, fxY - 10, `+${bonusPoints} NOVA!`, currentTheme.superFood, 1.45));
        this.superFood = null;
        this.updateHUD();
      }

      updateHUD() {
        this.ui.scoreVal.textContent = this.score;

        if (this.combo > 1) {
          this.ui.comboBadge.classList.add('active');
          this.ui.comboText.textContent = `COMBO x${this.combo}`;
        } else {
          this.ui.comboBadge.classList.remove('active');
        }

        this.ui.boostFill.style.width = `${Math.max(0, Math.min(100, this.boostEnergy))}%`;
        this.ui.boostContainer.classList.toggle('active', this.isBoosting);
        this.container.classList.toggle('boosting', this.isBoosting);
      }

      // --- Main Render / Animation Loop ---
      gameLoop(currentTime) {
        requestAnimationFrame((time) => this.gameLoop(time));

        if (this.state === 'PLAYING') {
          if (this.isBoosting && this.boostEnergy > 0) {
            this.boostEnergy = Math.max(0, this.boostEnergy - this.boostDepleteRate);
            if (this.boostEnergy <= 0) {
              this.isBoosting = false;
            }
          } else if (!this.isBoosting && this.boostEnergy < 100) {
            this.boostEnergy = Math.min(100, this.boostEnergy + this.boostRechargeRate);
          }
          this.updateHUD();
        }

        const currentSpeed = this.speedModes[this.speedModeIdx];
        const tickInterval = this.isBoosting ? currentSpeed.boostInterval : currentSpeed.interval;

        const elapsed = currentTime - this.lastTickTime;
        if (elapsed >= tickInterval) {
          this.tick();
          this.lastTickTime = currentTime;
        }

        this.stepProgress = Math.min(1, Math.max(0, (currentTime - this.lastTickTime) / tickInterval));

        this.render(currentTime);
      }

      render(currentTime) {
        const ctx = this.ctx;
        const width = this.canvasDisplaySize;
        const height = this.canvasDisplaySize;

        ctx.save();

        // Screen Shake
        if (this.screenShake > 0) {
          const shakeX = (Math.random() - 0.5) * this.screenShake;
          const shakeY = (Math.random() - 0.5) * this.screenShake;
          ctx.translate(shakeX, shakeY);
          this.screenShake *= 0.88;
          if (this.screenShake < 0.2) this.screenShake = 0;
        }

        // Background
        ctx.fillStyle = '#060814';
        ctx.fillRect(0, 0, width, height);

        // 1. Stardust motes
        this.renderAmbientStars(ctx, width, height);

        // 2. Cyber Grid
        this.renderGrid(ctx, width, height);

        // 3. Headlight glow cone
        if (this.snake.length > 0) {
          this.renderHeadLight(ctx);
        }

        // 4. Food & Super Food
        this.renderFood(ctx);

        // 5. Snake (smooth slithering spine)
        this.renderSnake(ctx, currentTime);

        // 6. Shockwaves
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.update();
          sw.draw(ctx);
          if (sw.life <= 0) this.shockwaves.splice(i, 1);
        }

        // 7. Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.update();
          p.draw(ctx);
          if (p.life <= 0) this.particles.splice(i, 1);
        }

        // 8. Floating numbers
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.update();
          ft.draw(ctx);
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }

        // 9. Overdrive Speed streaks
        if (this.isBoosting && this.state === 'PLAYING') {
          this.renderBoostSpeedLines(ctx, width, height, currentTime);
        }

        ctx.restore();
      }

      renderAmbientStars(ctx, width, height) {
        ctx.save();
        this.ambientStars.forEach(star => {
          star.y += star.speed;
          if (star.y > 1) star.y = 0;
          ctx.fillStyle = currentTheme.dotColor;
          ctx.globalAlpha = star.alpha;
          ctx.beginPath();
          ctx.arc(star.x * width, star.y * height, star.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      renderGrid(ctx, width, height) {
        ctx.save();
        ctx.strokeStyle = currentTheme.gridLine;
        ctx.lineWidth = 1;

        for (let i = 0; i <= this.gridSize; i++) {
          const pos = i * this.cellSize;
          ctx.beginPath();
          ctx.moveTo(pos, 0);
          ctx.lineTo(pos, height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, pos);
          ctx.lineTo(width, pos);
          ctx.stroke();
        }

        // Border styling
        if (this.wallMode === 'SOLID') {
          ctx.strokeStyle = currentTheme.glow;
          ctx.lineWidth = 2.5;
          ctx.shadowColor = currentTheme.glow;
          ctx.shadowBlur = 12;
        } else {
          // Portal dashed glowing border
          ctx.setLineDash([8, 8]);
          ctx.strokeStyle = '#00f2fe';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#00f2fe';
          ctx.shadowBlur = 10;
        }
        ctx.strokeRect(1, 1, width - 2, height - 2);
        ctx.restore();
      }

      renderHeadLight(ctx) {
        const head = this.snake[0];
        const prevHead = this.prevSnake[0] || head;

        // Skip interpolation jump if wrapping portal
        const isWrapping = Math.abs(head.x - prevHead.x) > 1 || Math.abs(head.y - prevHead.y) > 1;
        const interpX = ((isWrapping ? head.x : prevHead.x + (head.x - prevHead.x) * this.stepProgress) + 0.5) * this.cellSize;
        const interpY = ((isWrapping ? head.y : prevHead.y + (head.y - prevHead.y) * this.stepProgress) + 0.5) * this.cellSize;

        ctx.save();
        const lightGrad = ctx.createRadialGradient(interpX, interpY, 5, interpX, interpY, this.cellSize * 4.5);
        lightGrad.addColorStop(0, `${currentTheme.glow}35`);
        lightGrad.addColorStop(0.5, `${currentTheme.glow}12`);
        lightGrad.addColorStop(1, 'transparent');

        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.arc(interpX, interpY, this.cellSize * 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      renderFood(ctx) {
        this.foodPulse = (this.foodPulse + 0.05) % (Math.PI * 2);
        const pulseScale = 1 + Math.sin(this.foodPulse) * 0.12;

        const fx = (this.food.x + 0.5) * this.cellSize;
        const fy = (this.food.y + 0.5) * this.cellSize;
        const radius = (this.cellSize * 0.35) * pulseScale;

        ctx.save();
        ctx.shadowColor = currentTheme.foodGlow;
        ctx.shadowBlur = 18;

        // Orbital Ring
        ctx.strokeStyle = currentTheme.food;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(fx, fy, radius * 1.35, this.foodPulse * 1.6, this.foodPulse * 1.6 + Math.PI * 1.5);
        ctx.stroke();

        // Glowing Core
        const foodGrad = ctx.createRadialGradient(fx - radius * 0.3, fy - radius * 0.3, 1, fx, fy, radius);
        foodGrad.addColorStop(0, '#ffffff');
        foodGrad.addColorStop(0.4, currentTheme.food);
        foodGrad.addColorStop(1, currentTheme.foodGlow);

        ctx.fillStyle = foodGrad;
        ctx.beginPath();
        ctx.arc(fx, fy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Render Super Food
        if (this.superFood) {
          this.superFood.timer--;
          if (this.superFood.timer <= 0) {
            this.superFood = null;
            return;
          }

          const sfx = (this.superFood.x + 0.5) * this.cellSize;
          const sfy = (this.superFood.y + 0.5) * this.cellSize;
          const sRadius = (this.cellSize * 0.45) * (1 + Math.sin(this.foodPulse * 2) * 0.15);

          ctx.save();
          ctx.shadowColor = currentTheme.superFood;
          ctx.shadowBlur = 24;

          const progress = this.superFood.timer / this.superFood.maxTimer;
          ctx.strokeStyle = currentTheme.superFood;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(sfx, sfy, sRadius * 1.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
          ctx.stroke();

          ctx.fillStyle = currentTheme.superFood;
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            ctx.lineTo(sfx + Math.cos((18 + i * 72) * Math.PI / 180) * sRadius, sfy - Math.sin((18 + i * 72) * Math.PI / 180) * sRadius);
            ctx.lineTo(sfx + Math.cos((54 + i * 72) * Math.PI / 180) * (sRadius * 0.5), sfy - Math.sin((54 + i * 72) * Math.PI / 180) * (sRadius * 0.5));
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      renderSnake(ctx, currentTime) {
        if (this.snake.length === 0) return;

        const points = [];
        for (let i = 0; i < this.snake.length; i++) {
          const curr = this.snake[i];
          const prev = this.prevSnake[i] || curr;

          const isWrapping = Math.abs(curr.x - prev.x) > 1 || Math.abs(curr.y - prev.y) > 1;
          const px = ((isWrapping ? curr.x : prev.x + (curr.x - prev.x) * this.stepProgress) + 0.5) * this.cellSize;
          const py = ((isWrapping ? curr.y : prev.y + (curr.y - prev.y) * this.stepProgress) + 0.5) * this.cellSize;

          // Subtle organic serpentine wave undulation
          const wave = Math.sin(currentTime * 0.012 + i * 0.45) * (this.cellSize * 0.04) * (i > 0 ? 1 : 0);
          points.push({ x: px + wave * this.dir.y, y: py - wave * this.dir.x });
        }

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 1. Draw glowing outer spine segments
        for (let i = points.length - 1; i >= 1; i--) {
          const p1 = points[i];
          const p2 = points[i - 1];

          // Skip wrapping segments drawing a line across the whole screen
          if (Math.hypot(p1.x - p2.x, p1.y - p2.y) > this.cellSize * 2.5) continue;

          const ratio = 1 - (i / points.length);
          const segmentRadius = Math.max(3.5, (this.cellSize * 0.42) * (0.45 + 0.55 * ratio));

          ctx.shadowColor = currentTheme.glow;
          ctx.shadowBlur = this.isBoosting ? 24 : 15;
          ctx.strokeStyle = currentTheme.bodyGrad[Math.min(currentTheme.bodyGrad.length - 1, Math.floor((1 - ratio) * currentTheme.bodyGrad.length))];
          ctx.lineWidth = segmentRadius * 2;

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }

        // 2. Glossy core beads on each segment
        for (let i = points.length - 1; i >= 0; i--) {
          const pt = points[i];
          const ratio = 1 - (i / points.length);
          const radius = Math.max(2.5, (this.cellSize * 0.36) * (0.5 + 0.5 * ratio));

          ctx.shadowBlur = 0;
          ctx.fillStyle = i === 0 ? currentTheme.head : '#ffffff';
          ctx.globalAlpha = i === 0 ? 1 : 0.6 + 0.4 * ratio;

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, radius * (i === 0 ? 1.05 : 0.65), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 3. Draw Cyber Viper Head
        this.renderSnakeHead(ctx, points[0], points[1]);
      }

      renderSnakeHead(ctx, headPt, neckPt) {
        ctx.save();
        ctx.translate(headPt.x, headPt.y);

        let angle = Math.atan2(this.dir.y, this.dir.x);
        if (neckPt && Math.hypot(headPt.x - neckPt.x, headPt.y - neckPt.y) < this.cellSize * 2.5) {
          angle = Math.atan2(headPt.y - neckPt.y, headPt.x - neckPt.x);
        }
        ctx.rotate(angle);

        const headRadius = this.cellSize * 0.44;

        // Head Glow
        ctx.shadowColor = currentTheme.glow;
        ctx.shadowBlur = 22;

        const grad = ctx.createLinearGradient(-headRadius, 0, headRadius, 0);
        grad.addColorStop(0, currentTheme.bodyGrad[0]);
        grad.addColorStop(1, currentTheme.head);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(2, 0, headRadius * 1.15, headRadius * 0.95, 0, 0, Math.PI * 2);
        ctx.fill();

        // Glowing Cyber Eyes
        const eyeOffsetX = headRadius * 0.35;
        const eyeOffsetY = headRadius * 0.42;
        const eyeRadius = headRadius * 0.28;

        [-1, 1].forEach(side => {
          const ey = side * eyeOffsetY;

          ctx.shadowColor = currentTheme.eye;
          ctx.shadowBlur = 10;
          ctx.fillStyle = currentTheme.eye;
          ctx.beginPath();
          ctx.ellipse(eyeOffsetX, ey, eyeRadius, eyeRadius * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = currentTheme.eyePupil;
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.ellipse(eyeOffsetX + 1.2, ey, eyeRadius * 0.45, eyeRadius * 0.2, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // Dynamic Flickering Viper Tongue
        const distToFood = Math.hypot(this.snake[0].x - this.food.x, this.snake[0].y - this.food.y);
        if (distToFood < 4.5 && Math.sin(performance.now() * 0.015) > 0.25) {
          ctx.strokeStyle = currentTheme.food;
          ctx.lineWidth = 1.8;
          ctx.shadowColor = currentTheme.food;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(headRadius * 1.1, 0);
          ctx.lineTo(headRadius * 1.6, 0);
          ctx.lineTo(headRadius * 1.85, -2.5);
          ctx.moveTo(headRadius * 1.6, 0);
          ctx.lineTo(headRadius * 1.85, 2.5);
          ctx.stroke();
        }

        ctx.restore();
      }

      renderBoostSpeedLines(ctx, width, height, currentTime) {
        ctx.save();
        ctx.strokeStyle = 'rgba(0, 242, 254, 0.25)';
        ctx.lineWidth = 1.5;

        for (let i = 0; i < 7; i++) {
          const y = (Math.sin(currentTime * 0.005 + i * 2) * 0.5 + 0.5) * height;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width * (0.2 + Math.random() * 0.6), y);
          ctx.stroke();
        }
        ctx.restore();
      }

      // --- Bind Keyboard & Interaction Events ---
      bindEvents() {
        window.addEventListener('keydown', (e) => {
          sound.init();

          switch (e.key) {
            case 'ArrowUp':
            case 'KeyW':
            case 'w':
            case 'W':
              if (this.state === 'PLAYING') this.queueDirection(0, -1);
              e.preventDefault();
              break;
            case 'ArrowDown':
            case 'KeyS':
            case 's':
            case 'S':
              if (this.state === 'PLAYING') this.queueDirection(0, 1);
              e.preventDefault();
              break;
            case 'ArrowLeft':
            case 'KeyA':
            case 'a':
            case 'A':
              if (this.state === 'PLAYING') this.queueDirection(-1, 0);
              e.preventDefault();
              break;
            case 'ArrowRight':
            case 'KeyD':
            case 'd':
            case 'D':
              if (this.state === 'PLAYING') this.queueDirection(1, 0);
              e.preventDefault();
              break;
            case ' ':
            case 'Shift':
              if (this.state === 'PLAYING') {
                if (this.boostEnergy > 5) {
                  this.isBoosting = true;
                }
              } else if (this.state === 'START' || this.state === 'GAMEOVER') {
                this.startGame();
              }
              e.preventDefault();
              break;
            case 'p':
            case 'P':
              this.pauseGame();
              break;
            case 'm':
            case 'M':
              this.toggleAudio();
              break;
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.key === ' ' || e.key === 'Shift') {
            this.isBoosting = false;
          }
        });

        // Touch Swipe Gestures on Canvas
        let touchStartX = 0;
        let touchStartY = 0;

        this.canvas.addEventListener('touchstart', (e) => {
          sound.init();
          const t = e.touches[0];
          touchStartX = t.clientX;
          touchStartY = t.clientY;
        }, { passive: true });

        this.canvas.addEventListener('touchend', (e) => {
          const t = e.changedTouches[0];
          const dx = t.clientX - touchStartX;
          const dy = t.clientY - touchStartY;
          const dist = Math.hypot(dx, dy);

          if (dist > 25 && this.state === 'PLAYING') {
            if (Math.abs(dx) > Math.abs(dy)) {
              this.queueDirection(dx > 0 ? 1 : -1, 0);
            } else {
              this.queueDirection(0, dy > 0 ? 1 : -1);
            }
          }
        }, { passive: true });

        // Virtual D-pad
        const bindButton = (elemId, dirX, dirY) => {
          const btn = document.getElementById(elemId);
          if (!btn) return;
          const handler = (e) => {
            e.preventDefault();
            sound.init();
            if (this.state === 'PLAYING') this.queueDirection(dirX, dirY);
          };
          btn.addEventListener('touchstart', handler);
          btn.addEventListener('mousedown', handler);
        };

        bindButton('dpadUp', 0, -1);
        bindButton('dpadDown', 0, 1);
        bindButton('dpadLeft', -1, 0);
        bindButton('dpadRight', 1, 0);

        // Mobile Boost Button
        const boostBtn = this.ui.mobileBoostBtn;
        const startBoost = (e) => {
          e.preventDefault();
          sound.init();
          if (this.state === 'PLAYING' && this.boostEnergy > 5) {
            this.isBoosting = true;
          }
        };
        const endBoost = (e) => {
          e.preventDefault();
          this.isBoosting = false;
        };

        boostBtn.addEventListener('touchstart', startBoost);
        boostBtn.addEventListener('touchend', endBoost);
        boostBtn.addEventListener('mousedown', startBoost);
        boostBtn.addEventListener('mouseup', endBoost);
        boostBtn.addEventListener('mouseleave', endBoost);

        // UI Toolbar Buttons
        this.ui.btnAudio.addEventListener('click', () => this.toggleAudio());
        this.ui.btnMusic.addEventListener('click', () => this.toggleMusic());
        this.ui.btnWalls.addEventListener('click', () => this.toggleWalls());
        this.ui.btnCrt.addEventListener('click', () => this.toggleCrt());
        this.ui.btnSpeed.addEventListener('click', () => this.cycleSpeed());

        // Action Modal Button
        this.ui.btnActionModal.addEventListener('click', () => {
          if (this.state === 'PAUSED') {
            this.pauseGame();
          } else {
            this.startGame();
          }
        });

        // Show Start Modal initially
        this.ui.modalTitle.textContent = 'CYBER VIPER';
        this.ui.btnActionModal.textContent = 'LAUNCH MISSION';
        this.ui.newHighBadge.style.display = 'none';
        this.ui.gameModal.classList.add('visible');
      }

      toggleAudio() {
        sound.init();
        sound.sfxEnabled = !sound.sfxEnabled;
        this.ui.btnAudio.classList.toggle('active', sound.sfxEnabled);
        this.ui.audioIcon.textContent = sound.sfxEnabled ? '🔊' : '🔇';
      }

      toggleMusic() {
        sound.init();
        const active = sound.toggleMusic();
        this.ui.btnMusic.classList.toggle('active', active);
      }

      toggleWalls() {
        this.wallMode = this.wallMode === 'SOLID' ? 'PORTAL' : 'SOLID';
        this.ui.wallsLabel.textContent = this.wallMode;
        this.ui.btnWalls.classList.toggle('active', this.wallMode === 'PORTAL');
      }

      toggleCrt() {
        const overlay = this.ui.crtOverlay;
        const isDisabled = overlay.classList.toggle('disabled');
        this.ui.btnCrt.classList.toggle('active', !isDisabled);
      }

      cycleSpeed() {
        this.speedModeIdx = (this.speedModeIdx + 1) % this.speedModes.length;
        this.ui.speedLabel.textContent = this.speedModes[this.speedModeIdx].label;
      }
    }

    // Launch Game on load
    window.addEventListener('DOMContentLoaded', () => {
      new SnakeGame();
    });
  </script>
</body>
</html>
